name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One release run at a time, never cancelled mid-publish. GitHub may replace
# an already pending run with a newer one.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

# Read-only by default; release state inspection needs write access to see drafts.
permissions:
  contents: read

jobs:
  detect-version-bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      should_publish: ${{ steps.version.outputs.should_publish }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is needed to verify manual releases are on main.
          fetch-depth: 0
          persist-credentials: false

      - name: Verify manual release commit is on main
        if: github.event_name == 'workflow_dispatch'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::Manual releases must use a commit reachable from main."
            exit 1
          fi

      - name: Detect release state
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-status.mjs detect

      # Same matcher (scripts/changelog.mjs) as the release-notes extraction in
      # publish-release, so a release can't pass this gate and then ship notes
      # from the wrong section.
      - name: Validate changelog entry
        if: steps.version.outputs.should_publish == 'true'
        run: node scripts/validate-changelog.mjs

  frontend-checks:
    needs: detect-version-bump
    if: needs.detect-version-bump.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run typecheck

      - name: Run frontend unit tests
        run: npm run test:js && npm run test:ui

  rust-tests:
    needs: detect-version-bump
    if: needs.detect-version-bump.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config

      - name: Run Rust unit tests
        run: cargo test -q --features verifier --manifest-path src-tauri/Cargo.toml

      - name: Build updater verifier
        run: cargo build --locked --features verifier --manifest-path src-tauri/Cargo.toml --bin verify-updater

      - name: Upload updater verifier
        uses: actions/upload-artifact@v4
        with:
          name: updater-verifier
          path: src-tauri/target/debug/verify-updater
          if-no-files-found: error
          retention-days: 7

  build-release:
    needs:
      - detect-version-bump
      - frontend-checks
      - rust-tests
    if: needs.detect-version-bump.outputs.should_publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle-root: src-tauri/target/universal-apple-darwin/release/bundle
          - platform: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundle-root: src-tauri/target/x86_64-pc-windows-msvc/release/bundle
          - platform: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            bundle-root: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle

    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.detect-version-bump.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config

      - name: Install dependencies
        run: npm ci

      # Signing material lives in $RUNNER_TEMP (outside the checkout) and is
      # removed by the "Remove signing material" step below, even on failure.
      - name: Prepare updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY secret is required for updater artifacts."
            exit 1
          fi

          umask 077
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/updater-private.key"

      - name: Validate updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          key_file="$RUNNER_TEMP/updater-private.key"
          if [ ! -s "$key_file" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY secret is missing or empty."
            exit 1
          fi

          probe_file="$(mktemp)"
          printf 'updater-key-validation' > "$probe_file"

          sign_args=(--private-key-path "$key_file")
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]; then
            sign_args+=(--password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD")
          fi

          if ! npm run tauri -- signer sign "${sign_args[@]}" "$probe_file" >/dev/null; then
            echo "Updater signing key validation failed. Recheck TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD secrets."
            exit 1
          fi
          rm -f "$probe_file" "$probe_file.sig" "$key_file"

      - name: Import signing certificate
        if: matrix.platform == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_FILE="$RUNNER_TEMP/certificate.p12"

          umask 077
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_FILE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$CERT_FILE" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f "$CERT_FILE"

          CERT_ID=$(security find-identity -v -p codesigning build.keychain | awk -F'"' '/Developer ID Application:/ {print $2; exit}')
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"

      - name: Build macOS Tauri app
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build:mac -- --ci --bundles app --config src-tauri/tauri.updater.conf.json --config '{"build":{"beforeBuildCommand":"npx vite build"}}'

      - name: Build Windows or Linux Tauri app
        if: matrix.platform != 'macos'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            npm run tauri:build:win -- --ci --bundles nsis --config src-tauri/tauri.updater.conf.json --config '{"build":{"beforeBuildCommand":"npx vite build"}}'
          else
            npm run tauri:build:linux -- --ci --bundles appimage --config src-tauri/tauri.updater.conf.json --config '{"build":{"beforeBuildCommand":"npx vite build"}}'
          fi

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/updater-private.key" "$RUNNER_TEMP/certificate.p12"
          if [ "${{ matrix.platform }}" = "macos" ]; then
            security delete-keychain build.keychain 2>/dev/null || true
          fi

      # Windows only: Linux ships just the updater .AppImage.tar.gz from the
      # next step, macOS gets its .zip from the packaging step below.
      - name: Collect release asset
        if: matrix.platform == 'windows'
        run: node scripts/release-assets.mjs --platform ${{ matrix.platform }} --bundle-root ${{ matrix.bundle-root }} --out-dir dist --version "${{ env.VERSION }}"

      - name: Collect updater assets
        run: node scripts/release-updater-assets.mjs --platform ${{ matrix.platform }} --bundle-root ${{ matrix.bundle-root }} --out-dir dist --version "${{ env.VERSION }}"

      - name: Package macOS zip
        if: matrix.platform == 'macos'
        run: |
          mkdir -p dist
          APP_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/The Pair.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/the-pair-${{ env.VERSION }}.zip"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}
          path: dist/
          compression-level: 0
          retention-days: 7

  publish-release:
    needs:
      - detect-version-bump
      - build-release
    if: needs.detect-version-bump.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.detect-version-bump.outputs.version }}
      TAG: ${{ needs.detect-version-bump.outputs.tag }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: dist
          merge-multiple: true

      - name: Download updater verifier
        uses: actions/download-artifact@v4
        with:
          name: updater-verifier
          path: verifier

      - name: Verify updater signatures
        run: |
          chmod +x verifier/verify-updater
          verifier/verify-updater src-tauri/tauri.conf.json \
            "dist/the-pair-${VERSION}.app.tar.gz" "dist/the-pair-${VERSION}.app.tar.gz.sig" \
            "dist/the-pair-${VERSION}-setup.exe" "dist/the-pair-${VERSION}-setup.exe.sig" \
            "dist/the-pair-${VERSION}.AppImage.tar.gz" "dist/the-pair-${VERSION}.AppImage.tar.gz.sig"

      # Fails if CHANGELOG.md has no non-empty "## [VERSION]" section. The
      # contributors lookup is best effort and never fails the job.
      - name: Prepare release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release-notes.mjs \
            --version "$VERSION" \
            --changelog CHANGELOG.md \
            --output release-notes.md \
            --repo "$GITHUB_REPOSITORY" \
            --head "$GITHUB_SHA"

      - name: Generate updater manifest
        run: |
          node scripts/generate-updater-manifest.mjs \
            --version "$VERSION" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" \
            --dist-dir dist \
            --notes-file release-notes.md \
            --output dist/latest.json

      - name: Check release state again
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-status.mjs assert-new

      # Creating the ref is atomic: an existing tag can never be retargeted.
      - name: Create tag and draft
        id: create-draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${TAG}" -f "sha=${GITHUB_SHA}" >/dev/null
          release=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f "tag_name=${TAG}" -f "name=${TAG}" -f "body=$(<release-notes.md)" -F draft=true)
          echo "release_id=$(jq -er '.id' <<< "$release")" >> "$GITHUB_OUTPUT"
          upload_url=$(jq -er '.upload_url' <<< "$release")
          echo "upload_url=${upload_url%%\{*}" >> "$GITHUB_OUTPUT"

      - name: Upload draft assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLOAD_URL: ${{ steps.create-draft.outputs.upload_url }}
        run: |
          set -euo pipefail
          mapfile -t expected < <(node --input-type=module -e "for (const name of (await import('./scripts/release-status.mjs')).requiredAssets(process.env.VERSION)) console.log(name)" )
          actual_count=$(find dist -maxdepth 1 -type f | wc -l)
          if [ "$actual_count" -ne "${#expected[@]}" ]; then
            echo "::error::dist/ must contain exactly the required release assets (found $actual_count, expected ${#expected[@]})."
            exit 1
          fi
          for name in "${expected[@]}"; do
            test -f "dist/$name" || { echo "::error::Missing local asset dist/$name"; exit 1; }
            encoded=$(jq -rn --arg name "$name" '$name | @uri')
            curl --fail-with-body --silent --show-error --request POST \
              -H "Authorization: Bearer ${GH_TOKEN}" -H 'Content-Type: application/octet-stream' \
              --data-binary "@dist/$name" "${UPLOAD_URL}?name=${encoded}" >/dev/null
          done

      - name: Verify draft assets
        id: verify-draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_RELEASE_ID: ${{ steps.create-draft.outputs.release_id }}
        run: node scripts/release-status.mjs verify-draft

      - name: Publish verified draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.verify-draft.outputs.release_id }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '{draft,tag: .tag_name}')
          draft=$(jq -rn --argjson current "$current" '$current.draft')
          tag=$(jq -rn --argjson current "$current" '$current.tag')
          test "$draft" = "true" || { echo "::error::Release ${RELEASE_ID} is no longer a draft; refusing to publish."; exit 1; }
          test "$tag" = "$TAG" || { echo "::error::Release ${RELEASE_ID} tag changed; refusing to publish."; exit 1; }
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false >/dev/null

      - name: Recovery guidance
        if: failure()
        run: |
          echo '::error::Release failed. No release, tag or asset was automatically deleted. Inspect the tag, release and run artifacts in GitHub. For a draft, verify the tag commit and signatures, upload only missing assets, then publish manually after checking all assets. For an orphan tag, inspect it and choose a new version or resolve it manually. For a public release, never overwrite assets; publish fixes under a new version.'
