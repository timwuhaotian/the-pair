name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One release run at a time, never cancelled mid-publish. A run queued behind
# an in-progress release starts after it finishes, sees the tag it created in
# detect-version-bump, and skips publishing.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

# Read-only by default; only publish-release gets contents: write.
permissions:
  contents: read

jobs:
  detect-version-bump:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.version.outputs.should_publish }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + all tags, so an existing release tag is visible.
          fetch-depth: 0
          persist-credentials: false

      - name: Detect package version change
        id: version
        run: |
          node <<'NODE'
          const fs = require('fs')
          const { execFileSync } = require('child_process')

          const currentVersion = JSON.parse(fs.readFileSync('package.json', 'utf8')).version
          const tag = `v${currentVersion}`

          let tagExists = false
          try {
            execFileSync('git', ['rev-parse', '--verify', '--quiet', `refs/tags/${tag}`], { stdio: 'pipe' })
            tagExists = true
          } catch {
            tagExists = false
          }

          const shouldPublish = String(!tagExists)
          console.log(`version=${currentVersion} tag=${tag} tagExists=${tagExists} should_publish=${shouldPublish}`)

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${currentVersion}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `should_publish=${shouldPublish}\n`)
          NODE

      # Same matcher (scripts/changelog.mjs) as the release-notes extraction in
      # publish-release, so a release can't pass this gate and then ship notes
      # from the wrong section.
      - name: Validate changelog entry
        if: steps.version.outputs.should_publish == 'true'
        run: node scripts/validate-changelog.mjs

  lint-and-test:
    needs: detect-version-bump
    if: needs.detect-version-bump.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

  build-release:
    needs:
      - detect-version-bump
      - lint-and-test
    if: needs.detect-version-bump.outputs.should_publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle-root: src-tauri/target/universal-apple-darwin/release/bundle
          - platform: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundle-root: src-tauri/target/x86_64-pc-windows-msvc/release/bundle
          - platform: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            bundle-root: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle

    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.detect-version-bump.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config

      - name: Install dependencies
        run: npm ci

      # Signing material lives in $RUNNER_TEMP (outside the checkout) and is
      # removed by the "Remove signing material" step below, even on failure.
      - name: Prepare updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY secret is required for updater artifacts."
            exit 1
          fi

          umask 077
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/updater-private.key"

      - name: Validate updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          key_file="$RUNNER_TEMP/updater-private.key"
          if [ ! -s "$key_file" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY secret is missing or empty."
            exit 1
          fi

          probe_file="$(mktemp)"
          printf 'updater-key-validation' > "$probe_file"

          sign_args=(--private-key-path "$key_file")
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]; then
            sign_args+=(--password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD")
          fi

          if ! npm run tauri -- signer sign "${sign_args[@]}" "$probe_file" >/dev/null; then
            echo "Updater signing key validation failed. Recheck TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD secrets."
            exit 1
          fi
          rm -f "$probe_file" "$probe_file.sig" "$key_file"

      - name: Import signing certificate
        if: matrix.platform == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_FILE="$RUNNER_TEMP/certificate.p12"

          umask 077
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_FILE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$CERT_FILE" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f "$CERT_FILE"

          CERT_ID=$(security find-identity -v -p codesigning build.keychain | awk -F'"' '/Developer ID Application:/ {print $2; exit}')
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"

      - name: Build Tauri app
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ "${{ matrix.platform }}" = "macos" ]; then
            npm run tauri:build:mac -- --ci --bundles app --config src-tauri/tauri.updater.conf.json
          elif [ "${{ matrix.platform }}" = "windows" ]; then
            npm run tauri:build:win -- --ci --config src-tauri/tauri.updater.conf.json
          else
            npm run tauri:build:linux -- --ci --config src-tauri/tauri.updater.conf.json
          fi

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/updater-private.key" "$RUNNER_TEMP/certificate.p12"
          if [ "${{ matrix.platform }}" = "macos" ]; then
            security delete-keychain build.keychain 2>/dev/null || true
          fi

      - name: Collect release asset
        if: matrix.platform != 'macos'
        run: node scripts/release-assets.mjs --platform ${{ matrix.platform }} --bundle-root ${{ matrix.bundle-root }} --out-dir dist --version "${{ env.VERSION }}"

      - name: Collect updater assets
        run: node scripts/release-updater-assets.mjs --platform ${{ matrix.platform }} --bundle-root ${{ matrix.bundle-root }} --out-dir dist --version "${{ env.VERSION }}"

      - name: Package macOS zip
        if: matrix.platform == 'macos'
        run: |
          mkdir -p dist
          APP_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/The Pair.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/the-pair-${{ env.VERSION }}.zip"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}
          path: dist/
          retention-days: 7

  publish-release:
    needs:
      - detect-version-bump
      - build-release
    if: needs.detect-version-bump.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.detect-version-bump.outputs.version }}
      TAG: ${{ needs.detect-version-bump.outputs.tag }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: dist
          merge-multiple: true

      # Fails if CHANGELOG.md has no non-empty "## [VERSION]" section. The
      # contributors lookup is best effort and never fails the job.
      - name: Prepare release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release-notes.mjs \
            --version "$VERSION" \
            --changelog CHANGELOG.md \
            --output release-notes.md \
            --repo "$GITHUB_REPOSITORY" \
            --head "$GITHUB_SHA"

      - name: Generate updater manifest
        run: |
          node scripts/generate-updater-manifest.mjs \
            --version "$VERSION" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" \
            --dist-dir dist \
            --notes-file release-notes.md \
            --output dist/latest.json

      # Never overwrite a published release: its assets (and latest.json
      # signatures) may already have been downloaded by users.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to overwrite its assets. Bump the version to publish a new release."
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists without a release; refusing to publish a build of $GITHUB_SHA under it. Delete the stray tag or bump the version."
            exit 1
          fi

          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA"
