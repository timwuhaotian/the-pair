[package]
name = "app"
version = "3.0.3"
description = "The Pair desktop orchestrator for dual AI agents"
authors = ["timwuhaotian"]
license = "Apache-2.0"
repository = "https://github.com/timwuhaotian/the-pair"
edition = "2021"
rust-version = "1.77.2"
default-run = "app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# CI-only updater signature checker. Gated behind `required-features` so the
# macOS universal bundler (tauri-cli runs lipo for the main binary only,
# tauri-apps/tauri#16460) skips it instead of failing on the missing
# target/universal-apple-darwin/release/verify-updater.
[[bin]]
name = "verify-updater"
path = "src/bin/verify-updater.rs"
required-features = ["verifier"]

[features]
verifier = []

# The CLI test shells out to the verifier binary, so it only builds when the
# feature is on. This keeps bare `cargo test` green for local runs.
[[test]]
name = "updater_verifier_cli"
required-features = ["verifier"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
base64 = "0.22"
minisign-verify = "0.2.5"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-updater = "2.10.0"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
sysinfo = "0.33"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = "2.4.5"
tauri-plugin-opener = "2.5"
dirs = "5.0"
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "1.0.7"
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "stream", "http2", "json"] }
