    <text x="548" y="236" font-size="120" font-weight="700" fill="#FFFFFF" letter-spacing="-3">The Pair</text>
    <text x="552" y="302" font-size="33" fill="#CFE2F3">Two AI agents on one task.</text>
    <text x="552" y="346" font-size="33" fill="#CFE2F3">One writes the code, the other reviews it.</text>
    <text x="552" y="420" font-size="31" font-weight="700" fill="#E09C26">Open-source AI pair programming</text>
