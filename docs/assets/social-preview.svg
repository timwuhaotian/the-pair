<?xml version="1.0" encoding="UTF-8"?>
<!-- The Pair social preview, 1280x640 (GitHub's repository card size). The icon is app-icon.svg's
     drawing, copied in; when the icon changes, copy it again. Render with:
       rsvg-convert -w 1280 -h 640 -o docs/assets/social-preview.png docs/assets/social-preview.svg
     then upload the PNG under the repository's Settings → Social preview (there is no API for it). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="The Pair — open-source AI pair programming">
  <title>The Pair — open-source AI pair programming</title>
