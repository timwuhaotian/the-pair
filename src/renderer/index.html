<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>The Pair</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <style>
      /* The Tauri window is launched hidden and revealed only after React paints
         its own BootSplash (see src/renderer/src/main.tsx). These styles only
         matter for `npm run dev:renderer` (browser, no Tauri host) and as a
         theme-matched fallback in case `window.show()` ever races a paint. */
      :root {
        --boot-bg: #ffffff;
      }
      html.dark {
        --boot-bg: #020617;
      }
      body {
        background: var(--boot-bg);
        margin: 0;
        overflow: hidden;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      #root {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        width: 100vw;
      }
    </style>
    <script>
      ;(function () {
        try {
          const storage = JSON.parse(localStorage.getItem('theme-storage'))
          const theme = storage?.state?.theme
          if (
            theme === 'dark' ||
            (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)
          ) {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {}
      })()
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
